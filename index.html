        /* 分頁切換鈕排版 */

            gap: 10px;
            margin-bottom: 25px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            border: 2px solid #ddd;
            background: white;
            border-radius: 8px;
            color: #666;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        .tab-btn.buddha-tab.active {
            background: var(--buddha);
            border-color: var(--buddha);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }

        h1 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 5px;
        }
        h1.buddha-h1 {
            color: var(--buddha);
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }
        .section {
            margin-bottom: 25px;
            border-bottom: 1px solid #eee;
            padding-bottom: 20px;
        }
        .section-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 15px;
            color: var(--dark);
            display: flex;
            align-items: center;
        }
        .section-title::before {
            content: "";
            display: inline-block;
            width: 6px;
            height: 18px;
            background: var(--primary);
            margin-right: 10px;
            border-radius: 3px;
        }
        .buddha-title::before {
            background: var(--buddha) !important;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 12px;
        }
        .card {
            background: var(--light);
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card:hover {
            background: #f0f0f0;
        }
        .card input {
            position: absolute;
            opacity: 0;
        }
        .card.selected {
            border-color: var(--primary);
            background: #fff5f5;
        }
        .card-name {
            font-weight: bold;
            margin-bottom: 4px;
            color: #2d3436;
        }
        .card-desc {
            font-size: 0.8rem;
            color: #666;
            line-height: 1.4;
        }

            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 2px solid #ddd;
            font-size: 1rem;
            background: white;
            color: var(--dark);
            outline: none;
            margin-bottom: 15px;
        }

            border-color: var(--buddha);
        }
        .med-display {
            display: flex;
            gap: 12px;
            margin-top: 15px;
        }
        .med-box {
            flex: 1;
            background: #e3fafc;
            border: 2px dashed var(--buddha);
            padding: 15px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--buddha);
            border-radius: 8px;
        }

        .result-box {
            position: sticky;
            bottom: 20px;
            background: var(--dark);
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin-top: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            z-index: 1000;
        }
        .result-title {
            font-size: 0.9rem;
            color: var(--secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        .result-text {
            font-size: 1.3rem;
            font-weight: bold;
            word-break: break-all;
            line-height: 1.5;
        }
        .copy-btn {
            background: var(--primary);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;

            float: right;

</head>

// 渲染卡片邏輯 (保留你原本的手法)
function renderGroup(containerId, data, isRadio) {
    const container = document.getElementById(containerId);
    data.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
            <input type="${isRadio ? 'radio' : 'checkbox'}" name="${containerId}" value="${item.name}">
            <div class="card-name">${item.name}</div>
            <div class="card-desc">${item.desc}</div>
        `;
        
        card.addEventListener('click', (e) => {
            const input = card.querySelector('input');
            if (isRadio) {
                const isChecked = input.checked;
                document.querySelectorAll(`input[name="${containerId}"]`).forEach(i => i.parentElement.classList.remove('selected'));
                if (!isChecked) {
                    input.checked = true;
                    card.classList.add('selected');
                } else {
                    input.checked = false;
                }
            } else {
                input.checked = !input.checked;
                card.classList.toggle('selected', input.checked);
            }
            generateSentence();
        });
        container.appendChild(card);
    });
}

// 分頁切換機制
function switchTab(evt, tabId) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    
    document.getElementById(tabId).classList.add('active');
    evt.currentTarget.classList.add('active');
    
    // 配合當前頁面切換複製按鈕顏色
    const copyBtn = document.getElementById('main-copy-btn');
    if (tabId === 'buddha-tab') {
        copyBtn.classList.add('buddha-copy-btn');
    } else {
        copyBtn.classList.remove('buddha-copy-btn');
    }
    clearAll();
}

// 藥師咒：更新症狀下拉選單
function updateSymptoms() {
    const cat = document.getElementById('category-select').value;
    const symSelect = document.getElementById('symptom-select');
    symSelect.innerHTML = '<option value="">-- 請選擇症狀 --</option>';
    
    if (cat) {
        for (let sym in medicineData[cat]) {
            symSelect.options.add(new Option(sym, sym));
        }
    }
    document.getElementById('m1').innerText = "藥名 1";
    document.getElementById('m2').innerText = "藥名 2";
    document.getElementById('m3').innerText = "藥名 3";
}

// 藥師咒：對症產生專屬藥方句子
function generateMedSentence() {
    const cat = document.getElementById('category-select').value;
    const sym = document.getElementById('symptom-select').value;
    if (!cat || !sym) return;

    const meds = medicineData[cat][sym];
    document.getElementById('m1').innerText = meds[0];
    document.getElementById('m2').innerText = meds[1];
    document.getElementById('m3').innerText = meds[2];

    document.getElementById('output-text').innerText = `奉請藥師佛，針對「${sym}」，藥方為：${meds.join('、')}，藥師神咒，三界內外，百千倍，放光明。`;
}

// 幸福種子句：核心公式組裝邏輯 (保留你原本優化過的機制)
function generateSentence() {
    let elements = [];
    
    const selectedSource = document.querySelector('input[name="source-group"]:checked');
    if (selectedSource) elements.push(selectedSource.value);

    const selectedHost = document.querySelector('input[name="host-group"]:checked');
    if (selectedHost) elements.push(`請${selectedHost.value}`);
    
    const selectedGongfas = Array.from(document.querySelectorAll('input[name="gongfa-group"]:checked')).map(i => i.value);
    const selectedMantras = Array.from(document.querySelectorAll('input[name="mantra-group"]:checked')).map(i => i.value);
    let contents = [...selectedGongfas, ...selectedMantras];
    if (contents.length > 0) {
        elements.push(contents.join('，'));
    }
    
    const selectedMode = document.querySelector('input[name="mode-group"]:checked');
    if (selectedMode) {
        if (selectedMode.value === "特急急救模式") {
            if(elements.length > 0) {
                document.getElementById('output-text').innerText = elements.join('，') + '，特急急救模式，三界內外，超級放快光明。';
            } else {
                document.getElementById('output-text').innerText = '奉請特急金剛經急救模式三界內外超級放快光明。';
            }
            return;
        } else {
            elements.push(selectedMode.value);
        }    
    }
    
    if (elements.length === 0) {
        document.getElementById('output-text').innerText = "請由上方選擇需求...";
        return;
    }
    
    let finalSentence = elements.join('，') + '，三界內外，百千倍，放光明。';
    document.getElementById('output-text').innerText = finalSentence;
}

// 初始化網頁與藥詩咒分類
function initAll() {
    renderGroup('source-group', sources, true);
    renderGroup('host-group', hosts, true);
    renderGroup('mode-group', modes, true);
    renderGroup('gongfa-group', gongfas, false);
    renderGroup('mantra-group', mantras, false);
    
    const catSelect = document.getElementById('category-select');
    catSelect.innerHTML = '<option value="">-- 請選擇類別 --</option>';
    for (let cat in medicineData) {
        catSelect.options.add(new Option(cat, cat));
    }
}

// 重設
function clearAll() {
    document.querySelectorAll('input').forEach(i => {
        i.checked = false;
        i.parentElement.classList.remove('selected');
    });
    const catSelect = document.getElementById('category-select');
    if(catSelect) catSelect.value = "";
    updateSymptoms();
    document.getElementById('output-text').innerText = "請由上方選擇需求...";
}

// 複製功能
function copySentence() {
    const text = document.getElementById('output-text').innerText;
    if (text === "請由上方選擇需求...") return;
    navigator.clipboard.writeText(text).then(() => {
        alert('終極種子句已成功複製！');
    });
}

// 啟動
initAll();
