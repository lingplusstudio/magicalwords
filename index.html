<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>幸福種子句調配器-終極完整版</title>
    <style>
        :root {
            --primary: #ff7675;
            --secondary: #ffeaa7;
            --dark: #2d3436;
            --light: #f9f9f9;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f1f2f6;
            color: var(--dark);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        h1 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }
        .section {
            margin-bottom: 25px;
            border-bottom: 1px solid #eee;
            padding-bottom: 20px;
        }
        .section-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 15px;
            color: var(--dark);
            display: flex;
            align-items: center;
        }
        .section-title::before {
            content: "";
            display: inline-block;
            width: 6px;
            height: 18px;
            background: var(--primary);
            margin-right: 10px;
            border-radius: 3px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 12px;
        }
        .card {
            background: var(--light);
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card:hover {
            background: #f0f0f0;
        }
        .card input {
            position: absolute;
            opacity: 0;
        }
        .card.selected {
            border-color: var(--primary);
            background: #fff5f5;
        }
        .card-name {
            font-weight: bold;
            margin-bottom: 4px;
            color: #2d3436;
        }
        .card-desc {
            font-size: 0.8rem;
            color: #666;
            line-height: 1.4;
        }
        .result-box {
            position: sticky;
            bottom: 20px;
            background: var(--dark);
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin-top: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            z-index: 1000;
        }
        .result-title {
            font-size: 0.9rem;
            color: var(--secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        .result-text {
            font-size: 1.3rem;
            font-weight: bold;
            word-break: break-all;
            line-height: 1.5;
        }
        .copy-btn {
            background: var(--primary);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            float: right;
            margin-top: -5px;
        }
        .copy-btn:hover {
            background: #ff5252;
        }
        .clear-btn {
            background: #636e72;
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            float: right;
            margin-top: -5px;
            margin-right: 10px;
        }
        .clear-btn:hover {
            background: #2d3436;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>✨ 幸福種子句調配器 ✨</h1>
    <div class="subtitle">【全圖鑑終極完整版】100% 完整收錄書中 7 頁所有功法、模式與經咒</div>

    <div class="section">
        <div class="section-title">1. 選擇 權限等級 / 能量來源 (選填)</div>
        <div class="grid" id="source-group"></div>
    </div>

    <div class="section">
        <div class="section-title">2. 奉請 主持人 / 主法者 (選填)</div>
        <div class="grid" id="host-group"></div>
    </div>

    <div class="section">
        <div class="section-title">3. 搭配 經典 / 咒語 / 偈語 (可多選)</div>
        <div class="grid" id="mantra-group"></div>
    </div>

    <div class="section">
        <div class="section-title">4. 設定 作用模式 (選填)</div>
        <div class="grid" id="mode-group"></div>
    </div>

    <div class="section">
        <div class="section-title">5. 啟動 特定功法 (可多選)</div>
        <div class="grid" id="gongfa-group"></div>
    </div>



    <div class="result-box">
        <button class="copy-btn" onclick="copySentence()">複製句子</button>
        <button class="clear-btn" onclick="clearAll()">重設</button>
        <div class="result-title">🎯 你的專屬幸福種子句：</div>
        <div class="result-text" id="output-text">請由上方選擇需求...</div>
    </div>
</div>

    { name: "一切有為法，如夢幻泡影，如露亦如電，應作如是觀", desc: "淨心、化負面情緒、穩定心境。特別適合打坐前使用" },
    { name: "願以此功德，迴向於法界，我等與眾生，皆共成佛道", desc: "練功完有法喜的時候迴向使用，後可加上自己祈願" },
    { name: "解結解結解冤結，解了多生冤和業，洗心滌慮發虔誠，今對佛前求解結。藥師佛，藥師佛，消災延壽藥師佛，隨心滿願藥師佛", desc: "練功前請求和解不受干擾，可解三世因果及業障" },
    { name: "金剛經", desc: "般若類經書，能量場與護法神很穩定，適合正心正念者" },

const modes = [

    { name: "淨化模式", desc: "把汙濁的負面能量或干擾化開" },
    { name: "金剛模式", desc: "化解下降頭、符咒或跑宮廟帶來的負面因果體影響" },
    { name: "清涼模式", desc: "炎熱時避免中暑，或體內燥熱。建議搭配大悲水" },
    { name: "美白／帥氣模式", desc: "改變肉體及乙太體狀態，外在形象更佳。常搭配妙法蓮華經" },
    { name: "特急急救模式", desc: "急性狀況送醫之餘的功法輔助，可幫助緩解" },
    { name: "舒眠模式", desc: "提升睡眠品質。通常搭配楞嚴經/地藏經/普門品" },
    { name: "保護模式", desc: "「三界內外放光明」，保護家人遺體火化時靈魂不受痛苦" },
    { name: "重症模式", desc: "專用於癌症/重症，搭配藥師佛使用。用於親人為宜（救急不救窮）" }

    { name: "七彩金光愛與溫暖", desc: "八字真言。可打開身體寒氣與業力，對腫瘤也有能量" },
    { name: "九宮", desc: "補足八卦，與外丹一起修練。入門用五行，進階用九宮" },
    { name: "三昧真火", desc: "給予陽性能量，改善四肢冰冷、頸椎痛、預防寒冷型感冒" },
    { name: "三昧真火旺", desc: "補滿特定穴位開關竅(六關->八關->十關)，效率提升" },
    { name: "上元神金光大法令", desc: "幫助跳脫小我，從更高維度觀察問題、理解生命" },
    { name: "大悲（神咒）水", desc: "先請觀音賜水，將奉請的能量放進所要飲用的水中" },
    { name: "五行陣", desc: "聚焦能量(土金水木火土順時針)，可用於設立保護性結界" },
    { name: "內在小孩呼呼療癒", desc: "靈系功法後仍不圓滿時使用，撫慰受傷心靈" },
    { name: "天使靈氣", desc: "以此感受靈氣的能量加持" },
    { name: "心開意解", desc: "可以用以調理情緒體，迅速調適心境" },
    { name: "仙女美人令／美男子令", desc: "用以使容貌保持青春活力與容光煥發" },
    { name: "生命大金光", desc: "修復生魂與心脈，讓三魂與身體穩定結合，修復肉體" },
    { name: "生命大金光七彩大金光護體", desc: "特定用於輔助燒燙傷，使其恢復得較快" },
    { name: "佛光普照法", desc: "開心、興奮、陽光的陽性能量，使能量充沛、法喜充滿" },
    { name: "佛光補滿", desc: "適用練功後不舒服部位，手貼該處默唸此四字即可" },
    { name: "金甘露", desc: "玉皇大帝賜予。氣凝聚為液態、消業障、通中脈、安眠" },
    { name: "清淨自性", desc: "清洗因果業力，也可用於反思負面情緒或過錯" },
    { name: "無形針", desc: "施用在穴位，不用實體針，以氣的能量模擬針灸效果" },
    { name: "轉化調和令", desc: "調和能量分布。練功常打呵欠可用，加持胃經、腎經" },
    { name: "靈性伴侶", desc: "使伴侶關係和諧。單身者可改善外在人緣與異性關係" },
    { name: "靈性家人", desc: "使人間關係和諧圓滿，將周遭人(如同事)當家人對待" },
    { name: "靈脈清理", desc: "從根本做起，以最高視角淡化減輕三世因果，使肉靈同化" },
    { name: "靈氣充滿", desc: "使用前宜先使用靈脈清理，乾淨後再補充好能量" },
    { name: "靈界干擾", desc: "諸多不順時梳理乙太體，預先化解未來3-6個月的災厄" }
];


// 渲染卡片邏輯
function renderGroup(containerId, data, isRadio) {
    const container = document.getElementById(containerId);
    data.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
            <input type="${isRadio ? 'radio' : 'checkbox'}" name="${containerId}" value="${item.name}">
            <div class="card-name">${item.name}</div>
            <div class="card-desc">${item.desc}</div>
        `;
        
        card.addEventListener('click', (e) => {
            const input = card.querySelector('input');
            if (isRadio) {
                const isChecked = input.checked;
                document.querySelectorAll(`input[name="${containerId}"]`).forEach(i => i.parentElement.classList.remove('selected'));
                if (!isChecked) {
                    input.checked = true;
                    card.classList.add('selected');
                } else {
                    input.checked = false;
                }
            } else {
                input.checked = !input.checked;
                card.classList.toggle('selected', input.checked);
            }
            generateSentence();
        });
        container.appendChild(card);
    });
}

// 初始化網頁
renderGroup('source-group', sources, true);
renderGroup('host-group', hosts, true);
renderGroup('mode-group', modes, true);
renderGroup('gongfa-group', gongfas, false);
renderGroup('mantra-group', mantras, false);

// 核心公式組裝邏輯
function generateSentence() {
    let elements = [];
    
    // 1. 權限來源
    const selectedSource = document.querySelector('input[name="source-group"]:checked');
    if (selectedSource) elements.push(selectedSource.value);

    // 2. 主持人
    const selectedHost = document.querySelector('input[name="host-group"]:checked');
    if (selectedHost) elements.push(`請${selectedHost.value}`);
    
    // 3. 功法與經咒核心
    const selectedGongfas = Array.from(document.querySelectorAll('input[name="gongfa-group"]:checked')).map(i => i.value);
    const selectedMantras = Array.from(document.querySelectorAll('input[name="mantra-group"]:checked')).map(i => i.value);
    let contents = [...selectedGongfas, ...selectedMantras];
    if (contents.length > 0) {
        elements.push(contents.join('，'));
    }
   // 4. 作用模式
    const selectedMode = document.querySelector('input[name="mode-group"]:checked');
    if (selectedMode) {
        // 如果是特殊急救模式，依照書中原本的驚嘆號結尾
        if (selectedMode.value === "特急急救模式") {
            if(elements.length > 0) {
                // 如果前面有選其他，進行組合
                document.getElementById('output-text').innerText = elements.join('，') + '，特急急救模式，三界內外，超級放快光明。';
            } else {
                document.getElementById('output-text').innerText = '奉請特急金剛經急救模式三界內外超級放快光明。';
            }
            return;
        } else {
            elements.push(selectedMode.value);
        }    
 
    }
    
    // 判斷是否為空
    if (elements.length === 0) {
        document.getElementById('output-text').innerText = "請由上方選擇需求...";
        return;
    }
    
    // 5. 終極公式結尾
    let finalSentence = elements.join('，') + '，三界內外，百千倍，放光明。';
    document.getElementById('output-text').innerText = finalSentence;
}

// 重設
function clearAll() {
    document.querySelectorAll('input').forEach(i => {
        i.checked = false;
        i.parentElement.classList.remove('selected');
    });
    document.getElementById('output-text').innerText = "請由上方選擇需求...";
}

// 複製功能
function copySentence() {
    const text = document.getElementById('output-text').innerText;
    if (text === "請由上方選擇需求...") return;
    navigator.clipboard.writeText(text).then(() => {
        alert('終極種子句已成功複製！');
    });
}
</script>

</body>
</html>
